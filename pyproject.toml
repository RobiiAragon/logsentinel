[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "logsentinel"
version = "0.1.0"
description = "Log anomaly detection for SOC pipelines: template mining, Isolation Forest + autoencoder exported to ONNX (FP32/INT8), precision/recall/F1 on Loghub HDFS, and a web alert dashboard."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jesús Aragón" }]
requires-python = ">=3.11"
keywords = ["anomaly-detection", "logs", "soc", "onnx", "isolation-forest", "autoencoder", "loghub"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Inference needs only NumPy + ONNX Runtime (Termux: pkg install python-onnxruntime).
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.18"]
qnn = ["onnxruntime-qnn>=1.18"]
train = ["onnx>=1.15", "scikit-learn>=1.3", "skl2onnx>=1.16", "sympy>=1.12"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
  "onnxruntime>=1.18",
  "onnx>=1.15",
  "scikit-learn>=1.3",
  "skl2onnx>=1.16",
  "sympy>=1.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pytest>=8",
  "ruff>=0.5",
]

[project.scripts]
logsentinel = "logsentinel.cli:main"

[project.urls]
Homepage = "https://github.com/RobiiAragon/logsentinel"

[tool.hatch.build.targets.wheel]
packages = ["src/logsentinel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E501"]  # realistic HDFS log lines used as test data

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
