name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (synthetic logs + committed ONNX models on the committed HDFS sample)
        run: pytest -q -W ignore::DeprecationWarning
      - name: CLI smoke test
        run: |
          logsentinel providers
          logsentinel detect data/sample/hdfs_test_sample.log.gz --model autoencoder-int8 \
            --labels data/sample/hdfs_test_sample_labels.csv --db ci.db
